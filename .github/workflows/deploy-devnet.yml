name: Deploy to Devnet

on:
  workflow_dispatch:

env:
  SOLANA_PATH: /home/runner/.local/share/solana/install/active_release/bin
  AVM_PATH: /home/runner/.avm/bin
  CARGO_PATH: /home/runner/.cargo/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config build-essential

      - name: Install Rust 1.76.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.76.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Solana CLI v1.18.26
        run: |
          # Download from GitHub releases (more reliable than release.solana.com)
          curl -fsSL https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp
          sudo mv /tmp/solana-release/bin/* /usr/local/bin/
          echo "Solana version: $(solana --version)"

      - name: Install Anchor 0.23.0 via AVM
        run: |
          export PATH="/home/runner/.cargo/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          export PATH="/home/runner/.avm/bin:/home/runner/.cargo/bin:$PATH"
          avm install 0.23.0
          avm use 0.23.0
          echo "/home/runner/.avm/bin" >> $GITHUB_PATH

      - name: Setup wallets and generate program keypair
        run: |
          export PATH="/home/runner/.avm/bin:/home/runner/.cargo/bin:$PATH"
          mkdir -p ~/.config/solana/sae-games target/deploy

          echo '[24,166,229,1,209,97,71,192,154,38,207,91,102,172,139,220,202,172,49,155,169,232,57,147,2,90,236,13,246,79,204,119,199,197,224,1,246,118,8,116,249,6,177,30,141,141,121,135,83,176,96,23,1,139,103,197,111,9,253,247,183,64,79,4]' \
            > ~/.config/solana/sae-games/program-owner.json

          solana config set --url devnet --keypair ~/.config/solana/sae-games/program-owner.json
          echo "Authority: $(solana address)"

          solana-keygen new --no-bip39-passphrase --outfile target/deploy/sae_games-keypair.json --force
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/sae_games-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "Generated program ID: $PROGRAM_ID"

          sed -i "s/declare_id!(\"PUBKEY\")/declare_id!(\"$PROGRAM_ID\")/" programs/sae-games/src/lib.rs

          python3 -c "
          import sys
          pid = sys.argv[1]
          toml = '[toolchain]\nanchor_version = \"0.23.0\"\nsolana_version = \"1.18.26\"\n\n[features]\nseeds = false\n\n[programs.devnet]\nsae_games = \"' + pid + '\"\n\n[registry]\nurl = \"https://anchor.projectserum.com\"\n\n[provider]\ncluster = \"devnet\"\nwallet = \"~/.config/solana/sae-games/program-owner.json\"\n\n[scripts]\ntest = \"yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts\"\n'
          open('Anchor.toml', 'w').write(toml)
          print('Anchor.toml written for program:', pid)
          " "$PROGRAM_ID"

      - name: Airdrop devnet SOL
        run: |
          export PATH="/home/runner/.avm/bin:/home/runner/.cargo/bin:$PATH"
          AUTHORITY="ESq8kD6sWdAGF95YMngcBaUUj5kKAH3H4E935pKpFGDH"
          for i in 1 2 3 4; do
            solana airdrop 2 $AUTHORITY --url devnet || true
            sleep 25
          done
          echo "Balance: $(solana balance $AUTHORITY --url devnet)"

      - name: Build Anchor program
        run: |
          export PATH="/home/runner/.avm/bin:/home/runner/.cargo/bin:$PATH"
          echo "PATH=$PATH"
          which anchor || echo "anchor not in PATH"
          ls ~/.avm/bin/ || echo "no ~/.avm/bin"
          ls ~/.cargo/bin/anchor* 2>/dev/null || echo "no anchor in cargo bin"
          anchor --version || true
          anchor build 2>&1

      - name: Deploy to devnet
        run: |
          export PATH="/home/runner/.avm/bin:/home/runner/.cargo/bin:$PATH"
          anchor deploy --provider.cluster devnet
          echo "=============================="
          echo "DEPLOYED PROGRAM ID: $PROGRAM_ID"
          echo "=============================="

      - name: Save program keypair
        uses: actions/upload-artifact@v4
        with:
          name: sae-games-devnet-keypair
          path: target/deploy/sae_games-keypair.json
          retention-days: 90
