[package]
name = "sae-games"
version = "1.0.0"
description = "Smart Contract of Space Apes Empire Games on Solana Network"
edition = "2018"

[lib]
crate-type = ["cdylib", "lib"]
name = "sae_games"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = {git = "https://github.com/otter-sec/anchor", tag = "v0.23.0", features = ["init-if-needed"]}
anchor-spl = {git = "https://github.com/otter-sec/anchor", tag = "v0.23.0"}
getrandom = { version = "=0.2.5", features = ["custom"] }
